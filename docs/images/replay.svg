<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f6f8; stroke: #5b6b7a; stroke-width: 1.2; }
    .core { fill: #e8f1fb; stroke: #2f6fb2; stroke-width: 1.4; }
    .file { fill: #fff6e5; stroke: #b07a1c; stroke-width: 1.2; }
    .text { fill: #1d2733; }
    .dim { fill: #5b6b7a; font-size: 11.5px; }
    .title { fill: #1d2733; font-weight: bold; font-size: 14px; }
    .line { stroke: #5b6b7a; stroke-width: 1.3; fill: none; }
    .head { fill: #5b6b7a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1419; }
      .box { fill: #1b232c; stroke: #8a9aab; }
      .core { fill: #16283d; stroke: #6aa5e6; }
      .file { fill: #2e2412; stroke: #d8a24a; }
      .text, .title { fill: #e3e9ef; }
      .dim { fill: #9fb0c1; }
      .line { stroke: #8a9aab; }
      .head { fill: #8a9aab; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="330"/>

  <text class="title" x="20" y="28">On the server: lb record</text>
  <rect class="box" x="20" y="45" width="150" height="70" rx="6"/>
  <text class="text" x="95" y="75" text-anchor="middle">engine + adapter</text>
  <text class="dim" x="95" y="95" text-anchor="middle">frames, commands</text>

  <rect class="box" x="230" y="45" width="170" height="70" rx="6"/>
  <text class="text" x="315" y="75" text-anchor="middle">RecordingHost</text>
  <text class="dim" x="315" y="95" text-anchor="middle">keeps every answer</text>

  <rect class="core" x="460" y="45" width="150" height="70" rx="6"/>
  <text class="text" x="535" y="75" text-anchor="middle">Runtime</text>
  <text class="dim" x="535" y="95" text-anchor="middle">bots decide</text>

  <rect class="box" x="670" y="45" width="190" height="70" rx="6"/>
  <text class="text" x="765" y="70" text-anchor="middle">Recorder</text>
  <text class="dim" x="765" y="88" text-anchor="middle">step = input + answers</text>
  <text class="dim" x="765" y="104" text-anchor="middle">+ outside inputs</text>

  <path class="line" d="M170,80 L228,80" marker-end="url(#arrow)"/>
  <path class="line" d="M400,72 L458,72" marker-end="url(#arrow)"/>
  <path class="line" d="M458,90 L402,90" marker-end="url(#arrow)"/>
  <text class="dim" x="429" y="66" text-anchor="middle">calls</text>
  <text class="dim" x="429" y="106" text-anchor="middle">answers</text>
  <path class="line" d="M610,80 L668,80" marker-end="url(#arrow)"/>

  <rect class="file" x="670" y="145" width="190" height="50" rx="6"/>
  <text class="text" x="765" y="167" text-anchor="middle">map-time.lbrec</text>
  <text class="dim" x="765" y="185" text-anchor="middle">postcard + lz4 blocks</text>
  <path class="line" d="M765,115 L765,143" marker-end="url(#arrow)"/>

  <text class="title" x="20" y="232">On a developer machine: lb-cli replay</text>
  <rect class="box" x="230" y="250" width="170" height="70" rx="6"/>
  <text class="text" x="315" y="280" text-anchor="middle">ReplayHost</text>
  <text class="dim" x="315" y="300" text-anchor="middle">answers, compares</text>

  <rect class="core" x="460" y="250" width="150" height="70" rx="6"/>
  <text class="text" x="535" y="280" text-anchor="middle">Runtime</text>
  <text class="dim" x="535" y="300" text-anchor="middle">rebuilt from Start</text>

  <rect class="box" x="20" y="250" width="150" height="70" rx="6"/>
  <text class="text" x="95" y="280" text-anchor="middle">report</text>
  <text class="dim" x="95" y="300" text-anchor="middle">same or first diff</text>

  <path class="line" d="M765,195 L765,285 L612,285" marker-end="url(#arrow)"/>
  <text class="dim" x="690" y="276" text-anchor="middle">steps</text>
  <path class="line" d="M458,277 L402,277" marker-end="url(#arrow)"/>
  <path class="line" d="M402,295 L458,295" marker-end="url(#arrow)"/>
  <path class="line" d="M228,285 L172,285" marker-end="url(#arrow)"/>
</svg>
