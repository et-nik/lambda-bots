language = "C"
header = "/* lambdabots C ABI types. GENERATED by `cargo xtask abi` from crates/lb-ffi. Do not edit. */"
include_guard = "LAMBDABOTS_LB_ABI_H"
include_version = false
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"

[export]
item_types = ["constants", "structs", "typedefs", "opaque"]
include = ["LbStr","LbVec3","LbEntRef","LbArgs","LbInitInfo","LbInitResult","LbMapInfo","LbFrameHeader","LbClientSnapshot","LbSelfSnapshot","LbEventBatch","LbFrameInput","LbEventHeader","LbEvClient","LbEvUserMsg","LbMsgArg","LbEvSound","LbEvPlayback","LbEvEntity","LbEvCommand","LbEvFixangle","LbEvNamed","LbEvOverflow","LbBotCommand","LbMoveFeedback","LbClientCommand","LbTraceRequest","LbTraceResult","LbTrackRule","LbEntitySnapshot","LbKeyValue","LbCreateBotRequest","LbCreateBotResult","LbDisguise","LbDebugPrim","LbCvarSpec","LbOwnedBuffer","LbCompatFacts","LbHostApi"]

[const]
allow_static_const = false
