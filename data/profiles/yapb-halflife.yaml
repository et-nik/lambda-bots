schema: lambdabots/profiles@1

# The bot profiles of yapb-halflife (bots.json), carried over one to one:
#
#   difficulty           -> skill (noob 0, easy 25, normal 50, hard 75, expert 100)
#   personality normal   -> style balanced  (aggression 0.4..0.7, fear 0.4..0.7, as in yapb)
#   personality rusher   -> style rusher    (aggression 0.7..1.0, fear 0.0..0.4)
#   personality careful  -> style sniper    (aggression 0.2..0.5, fear 0.7..1.0)
#   aggression, fear     -> traits; as in yapb they replace the style's draw, a missing one is drawn from it
#
# The default roster filter (lb_difficulty normal = skill 38..62) admits only the normal ones; set
# `roster.difficulty: any` in config/lambdabots.yaml (or `lb_difficulty any`) to let all of them join.

bots:
