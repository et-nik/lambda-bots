schema: lambdabots/profiles@1

# Your bot personalities. A personality binds a nickname to a play style, a skill and a look: the bot
# with this nickname always plays the same way, on every map and after server restarts. Any number of
# files in profiles/ is read; nicknames must be unique across them. Every field except `name` is
# optional: a missing one is derived from the nickname once and never changes.
#
#   name       nickname, up to 31 bytes, without quotes, `;`, `%` or `\`
#   style      balanced | rusher | sniper | controller | trapper (default balanced)
#   skill      0..100 or noob | easy | normal | hard | expert (= 0, 25, 50, 75, 100; default 50)
#   model      player model (default: one of bots.models in lambdabots.yaml)
#   colors     [top, bottom], 0..255
#   traits     { aggression: 0..1, fear: 0..1 } (default: drawn once within the style's range)
#   weapons    preferred weapons, best first: [crossbow, "357", shotgun]
#   weight     how often it is picked to join, relative to others (default 1; 0 = only `lb add <name>`)
#   tags       free labels
#   seed       seed of its own random habits (default: from the nickname)
#   overrides  single skill parameters from config/difficulty.yaml, e.g. { turn_speed: 520 }
#
# Personalities the server created for nicknames from names/<language>.yaml live in data/profiles.yaml;
# copy an entry here to take it over. An entry here wins over one with the same name there.
#
# Example:
#
# bots:
#   - name: "Kleiner"
#     style: sniper
#     skill: 70
#     model: scientist
#     colors: [160, 40]
#     traits: { aggression: 0.35, fear: 0.8 }
#     weapons: [crossbow, "357"]
#     weight: 2
#   - name: "Barney"
#     style: rusher
#     skill: hard
#     overrides: { turn_speed: 600 }

bots:
