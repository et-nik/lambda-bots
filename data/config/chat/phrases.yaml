schema: lambdabots/chat-phrases@1
# Ready lines the bots say on game moments when the AI chat is on (chat.enabled and chat.phrases.enabled). A moment
# gets one of its phrases unless the model's share (chat.phrases.ai_share) comes up, and always while the model is
# out of reach: no key, no credit, the day's tokens spent, a wait after failures. Players the bots know are greeted by
# the model. Players who write in English get the en phrases, everyone else those of chat.language (en when there are
# none). A phrase said lately (the last 30 of all bots) is not picked again while others are left. A bot without its
# own chat.style says the common phrases in its manner: lower case, now and then a smile.
#
# bots: a bot's own phrases, said as written and added to the common ones; with replace: true they replace the
# common ones for the moments the bot lists. name: the personality's name as `lb list` shows it, or the nickname in
# the game.
#
# Moments and their placeholders ({map}, the map's name, fits all; any other is an error; a phrase may use none):
#   greet             a player the bot does not know joins, or says hi to all          {name}
#   streak            the bot kills 10+ without dying, players among them              {count}
#   streak_other      a player kills 10+ without dying                                 {name} {count}
#   multikill         the bot kills 3+ within seconds, players among them              {count}
#   multikill_other   a player kills 3+ within seconds                                 {name} {count}
#   revenge           the bot kills a player who had killed it 3+ times in a row       {name}
#   nemesis           a player kills the bot the 3rd time in a row, then every 2 more  {name} {count}
#   crowbarred        a player kills the bot with the crowbar (not in GunGame)         {name}
#   crowbar_kill      the bot kills a player with the crowbar (not in GunGame)         {name}
#   own_blast         the bot blows itself up                                          {weapon}
#   own_blast_other   a player blows themselves up                                     {name} {weapon}
#   killed_typing     a player kills the bot while it types                            {name}
#   last_level        the bot reaches the last GunGame level
#   win               the bot wins the map
#   gg                a human player wins the map                                      {name}
#   fight_won         the bot kills a player after a firefight with them               {name}
#   fight_lost        a player kills the bot after a firefight with it                 {name}
#   fight_traded      the bot and a player kill each other after a firefight           {name}
#   fight_stolen      another player kills the one the bot had a firefight with        {name}
#   fight_helped      a teammate kills the one the bot had a firefight with            {name}
#   fight_interrupted another player kills the bot in the middle of a firefight        {name}
#   fight_fled        a player breaks off a firefight with the bot                     {name}
#   fight_retreat     the bot pulls back from a firefight with a player                {name}
# A firefight: the bot and a player in sight of each other both shooting for 3 s or more. A long one (6+ s),
# a trade, or one the bot wins or breaks off with 20 HP or less always gets the model's word (these phrases while
# it is out of reach). In fight_stolen, fight_helped and fight_interrupted {name} is the one who came between.
# A map another bot or nobody won gets the model's word, or none while the model is out of reach.
# {name} is the other player: their alias from players.yaml, else the name the model gave them (chat.memory.ai_aliases),
# else the nickname without clan tags; none when a word of it swears or is a slur, so keep some phrases without it.
# Put it where it needs no case ending: "{name}, привет", "{name} в ударе". {count} is a number; put it where it needs
# no agreement: "{count} подряд", "уже {count}", "{count}-й раз". {weapon} reads "сачелем", "из ракетницы", "with a
# rocket", as in "сам себя {weapon}". A phrase is skipped when a placeholder has no value or the filled-in line is too
# long.
#
# Quote every phrase: unquoted, - {name}, hi is read as a YAML mapping and breaks the file. A phrase is 1 to 60
# characters (keep it under 45: bots with long nicknames get shorter chat lines), without " or %, and does not start
# with / ! @ . or #; at most 64 phrases a moment. Check the file with lb-cli config check config/.
