schema: lambdabots/chat-players@1
# What the bots know of regular players, in your words; they also keep notes of their own in data/chat/memory.json.
# id: a SteamID, or the nickname of a player without one (bots too); name: the nickname, for you to read (what is
# written for a SteamID goes to that SteamID only); alias: what the bots call the player instead of a hard nickname,
# one name or a list (the main one first; a SteamID keeps them when the nickname changes); note: anything worth
# knowing; by_name: true makes a nickname entry serve anyone with that nickname whatever the SteamID, for players
# whose SteamID changes every visit (whoever takes the nickname gets the alias and the note). alias, note and by_name
# are optional.
