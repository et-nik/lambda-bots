schema: lambdabots/main@1

# Bot count. mode: fill = keep `count` players in total (bots leave as humans join),
# normal = keep `count` bots, match = `match_ratio` bots per human.
quota:
  count: 8
  mode: fill
  match_ratio: 1.0
  autovacate: true        # always leave `keep_slots` free for joining humans
  keep_slots: 1
  count_connecting: true
  join_after_player: false
  join_delay: 5.0         # seconds after map start before the first bot joins
  join_interval: [0.5, 3.0]

bots:
  name_prefix: ""         # shown before every bot name, e.g. "[BOT] "
  save_names: true        # the same bots come back after a map change
  language: en            # names/<language>.yaml: nicknames for new personalities
  models: [barney, gina, gman, gordon, helmet, hgrunt, recon, robo, scientist, zombie]
  rotate:
    enabled: false
    stay: [360, 3600]
    rejoin_delay: [20, 90]
  force_respawn: true
  respawn_delay: [0.3, 1.2]
  stuck_kill_time: 20.0
  reflex: 1.0             # how quick every bot is on top of its skill, 0.5..2: 2 recognizes and aims in half the
                          # time and turns twice as fast (cvar lb_reflex)

# Personalities: a nickname always plays with the same style, skill (0..100) and look. They come from
# profiles/*.yaml (written by you) and data/profiles.yaml (created by the server for new nicknames).
roster:
  # Who may join, by skill: any | noob | easy | normal | hard | expert (a band around the preset: hard = 63..87)
  # | a number (60 = 48..72) | a range (normal-hard, 40-70). A personality's own skill never changes.
  difficulty: normal
  styles: any             # any | comma list of balanced, rusher, sniper, controller, trapper
  generate:
    enabled: true         # create personalities for new nicknames when the filtered roster is too small
    pool: 16              # keep at least this many personalities passing the filters
    styles: { balanced: 4, rusher: 2, sniper: 1, controller: 2, trapper: 1 }   # style mix of new ones

engine:
  cmd_rate: 100           # commands per second per bot sent to the engine; 0 = every frame
  max_cmd_debt_ms: 200
  workers: -1
  master_seed: 0          # 0 = random per start

nav:
  source: generated       # generated: made from the map (kept in nav/<map>/); yapb: the map's yapb graph
  threads: -2             # threads making a graph; negative = all cores but that many
  trust_imported: false   # plan through yapb links the map check failed

telemetry:
  enabled: false
  dest: 127.0.0.1
  port: 27070
  hz: 10
  cmd_bind: 127.0.0.1
  secret: ""              # HMAC secret for remote commands; empty disables the command channel
  allow_unauthenticated_loopback: false
  max_kbps: 1024

access:
  admins: []              # SteamIDs allowed to use `lb` from the client console, e.g. "STEAM_0:1:12345"
  password: ""
  password_key: _lbpw
  editor_enabled: false
  listen_host_is_admin: true

logging:
  level: info
  console_level: warn
  file: true
  max_files: 7

# The game DLL, where its weapon rules differ (satchel buttons, hand grenade speed): auto = BugfixedHL-Rebased when
# its cvars are there; else grenades by Valve's 2023 update (hlsdk-portable plays by them) and satchels the classic
# way (the secondary attack throws, the primary sets them off); or name it: bugfixed | hl25 | classic (the SDK before
# 2023). `lb selftest` checks it live, and the bots check the satchel buttons as they use them.
game:
  dll: auto

# Tricks the bots may use; how often each happens is up to a bot's style and skill (beginners leave all but the
# long jumps on the way alone). longjump: with the module, long jumps across gaps, along straight stretches of the
# way and at enemies; gauss_jump: gauss jumps on the way somewhere far, the gauss in hand; gauss_boost: the gauss
# boost links of the navigation graph, onto ledges and across; satchel_jump: satchels thrown from a jump and set off
# in flight; grenade_jump: hand grenades thrown from a jump (a long jump with the module) at an enemy far off or above;
# bhop: bunny hopping (hard and expert) along straight stretches of the way and closing in on an enemy, on any server
# (one that crops faster jumps, as mp_bunnyhop 0 does, is hopped just under the crop).
tricks:
  longjump: true
  gauss_jump: true
  gauss_boost: true
  satchel_jump: true
  grenade_jump: true
  bhop: true

gungame:
  mode: auto              # auto | on | off
  detect_cvar: gg_enabled
  frags_per_level: 100

disguise:
  fake_ping: false
  scoreboard_bot_flag: false
  avatars: false
  fake_steamid: false
  hide_bots_in_queries: false

# Bots talking in the game chat through a chat model (docs/chat.md): they answer players and now and then say
# something about the game; an alive bot stands still while it types, a dead one types before it respawns. Off until
# enabled; nothing is sent while no human is on the server. language: what the bots write in (a player writing English
# gets English; a line the bots can tell is in another language gets no answer, and on a server whose language is
# written in Cyrillic, such as uk or bg, every Cyrillic line counts as its language); server: a line about the server
# for the bots, e.g. "GunGame server hldm.org". The rest is in config/chat/: players.yaml (regular players),
# server.yaml (the server), bots.yaml (single bots), maps.yaml (maps) and phrases.yaml (ready lines for game moments).
chat:
  enabled: false
  language: ru
  server: ""
  require_humans: true
  provider:
    kind: anthropic         # anthropic (Messages API) | openai (OpenAI-compatible chat completions)
    base_url: ""            # "" = https://api.anthropic.com; a gateway in front of the API goes here; openai needs
                            # one, e.g. http://127.0.0.1:11434/v1
    model: claude-haiku-4-5
    api_key: ""             # the key, else api_key_file (a file holding it), else the api_key_env variable
    api_key_file: ""
    api_key_env: ANTHROPIC_API_KEY
    ca_file: ""             # PEM certificates trusted on top of the system's (a gateway's own CA)
    headers: {}             # extra HTTP headers for every request, e.g. a gateway's own key
    timeout: 12             # seconds a request may take
    max_tokens: 100
    # temperature: 0.9      # sent only when set: some models refuse it
    extra_body: ""          # JSON object merged into every request, e.g. '{"output_config": {"effort": "low"}}'
  limits:
    lines_per_minute: 2     # all bots together
    remark_gap: 60          # seconds between game moments and comments on lines meant for everybody
    bot_remark_gap: 240     # seconds between two game moments of one bot
    remarks_per_hour: 6     # lines nobody asked for, all bots together: game moments, greetings, answers to lines
                            # meant for everybody; 0 = none
    requests_per_minute: 6
    tokens_per_day: 2000000 # in and out, UTC day, then ready phrases only; 0 = no limit
  typing:
    cpm: [200, 380]         # characters a minute, for personalities without their own speed
    calm: 3                 # seconds without an enemy before an alive bot starts typing
  memory:
    enabled: true           # remember players between maps and restarts (data/chat/memory.json)
    ai_notes: true          # one request after each map updates notes about the players met
    forget_after_days: 120
  # Plugin chat commands, one word each: a player's line starting with one is not chat, and no bot says one.
  blocked: [rtv, rockthevote, nominate, nominations, timeleft, nextmap, thetime, currentmap, listmaps, recentmaps,
            votemap, callvote, agstart, agabort, agpause, agallow, agmap, agnextmap, agnextmode]
  transcript: false         # every request to the model and its answer in logs/chat.<date>.log (the newest 7 kept)
  chatlog: true             # the game chat, joins and leaves in logs/chatlog.<date>.log (UTC days), chat on or off
  chatlog_days: 30          # days of chat logs kept; older ones go at a map start once a UTC day, chatlog on or off
  phrases:
    enabled: true           # ready lines from config/chat/phrases.yaml for game moments and greetings
    ai_share: 0.15          # the share of moments the model gets instead of a phrase
