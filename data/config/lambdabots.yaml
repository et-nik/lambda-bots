schema: lambdabots/main@1

# Bot count. mode: fill = keep `count` players in total (bots leave as humans join),
# normal = keep `count` bots, match = `match_ratio` bots per human.
quota:
  count: 8
  mode: fill
  match_ratio: 1.0
  autovacate: true        # always leave `keep_slots` free for joining humans
  keep_slots: 1
  count_connecting: true
  join_after_player: false
  join_delay: 5.0         # seconds after map start before the first bot joins
  join_interval: [0.5, 3.0]

bots:
  name_prefix: ""         # shown before every bot name, e.g. "[BOT] "
  save_names: true        # the same bots come back after a map change
  language: en            # names/<language>.yaml: nicknames for new personalities
  models: [barney, gina, gman, gordon, helmet, hgrunt, recon, robo, scientist, zombie]
  rotate:
    enabled: false
    stay: [360, 3600]
    rejoin_delay: [20, 90]
  force_respawn: true
  respawn_delay: [0.3, 1.2]
  stuck_kill_time: 20.0

# Personalities: a nickname always plays with the same style, skill (0..100) and look. They come from
# profiles/*.yaml (written by you) and data/profiles.yaml (created by the server for new nicknames).
roster:
  # Who may join, by skill: any | noob | easy | normal | hard | expert (a band around the preset: hard = 63..87)
  # | a number (60 = 48..72) | a range (normal-hard, 40-70). A personality's own skill never changes.
  difficulty: normal
  styles: any             # any | comma list of balanced, rusher, sniper, controller, trapper
  generate:
    enabled: true         # create personalities for new nicknames when the filtered roster is too small
    pool: 16              # keep at least this many personalities passing the filters
    styles: { balanced: 4, rusher: 2, sniper: 1, controller: 2, trapper: 1 }   # style mix of new ones

engine:
  cmd_rate: 100           # commands per second per bot sent to the engine; 0 = every frame
  max_cmd_debt_ms: 200
  workers: -1
  master_seed: 0          # 0 = random per start

nav:
  source: generated       # generated: made from the map (kept in nav/<map>/); yapb: the map's yapb graph
  threads: -2             # threads making a graph; negative = all cores but that many
  trust_imported: false   # plan through yapb links the map check failed

telemetry:
  enabled: false
  dest: 127.0.0.1
  port: 27070
  hz: 10
  cmd_bind: 127.0.0.1
  secret: ""              # HMAC secret for remote commands; empty disables the command channel
  allow_unauthenticated_loopback: false
  max_kbps: 1024

access:
  admins: []              # SteamIDs allowed to use `lb` from the client console, e.g. "STEAM_0:1:12345"
  password: ""
  password_key: _lbpw
  editor_enabled: false
  listen_host_is_admin: true

logging:
  level: info
  console_level: warn
  file: true
  max_files: 7

# The game DLL, where its weapon rules differ (satchel buttons, hand grenade speed): auto = BugfixedHL-Rebased when
# its cvars are there; else grenades by Valve's 2023 update (hlsdk-portable plays by them) and satchels the classic
# way (the secondary attack throws, the primary sets them off); or name it: bugfixed | hl25 | classic (the SDK before
# 2023). `lb selftest` checks it live, and the bots check the satchel buttons as they use them.
game:
  dll: auto

gungame:
  mode: auto              # auto | on | off
  detect_cvar: gg_enabled
  frags_per_level: 100

disguise:
  fake_ping: false
  scoreboard_bot_flag: false
  avatars: false
  fake_steamid: false
  hide_bots_in_queries: false
