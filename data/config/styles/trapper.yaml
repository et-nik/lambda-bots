schema: lambdabots/style@1

# Plays it safe and lays traps: tripmines across busy corridors and round corners, satchels at chokepoints it
# watches from out of the way; chases less, backs off earlier.
#
#   traits   ranges new personalities of this style draw aggression and fear from (0..1)
#   goals    multipliers of goal weights:
#            engage (fight an enemy in sight), hunt (chase one lost moments ago), retreat (back off when hurt),
#            collect (go for weapons, ammo, health, armor), roam (wander), investigate (go and see what made a
#            sound), camp (hold a spot with long sightlines), ambush (wait out of the way by a chokepoint),
#            control (wait by an item about to come back), trap (lay tripmines and satchels where players pass)
#   weapons  guns: multipliers of how good the style finds a gun (its classname without weapon_, 1 = as good as
#            its damage says; a list given replaces the built-in one), throwables: how readily it throws grenades,
#            satchels and snarks
#
# Anything left out keeps its built-in value.

id: trapper
traits:
  aggression: [0.30, 0.60]
  fear: [0.50, 0.80]
goals:
  engage: 1.0
  hunt: 0.8
  retreat: 1.2
  collect: 1.0
  roam: 1.0
  investigate: 0.8
  camp: 0.4
  ambush: 1.2
  control: 0.6
  trap: 2.0
weapons:
  guns:
    "9mmAR": 1.1
  throwables: 1.6
