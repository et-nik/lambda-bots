schema: lambdabots/style@1

# Plays it safe and lays traps (traps come later): chases less, backs off earlier.
#
#   traits   ranges new personalities of this style draw aggression and fear from (0..1)
#   goals    multipliers of goal weights, 1 = the balanced style:
#            engage (fight an enemy in sight), hunt (chase one lost moments ago), retreat (back off when hurt),
#            collect (go for weapons, ammo, health, armor), roam (wander)
#
# Anything left out keeps its built-in value.

id: trapper
traits:
  aggression: [0.30, 0.60]
  fear: [0.50, 0.80]
goals:
  engage: 1.0
  hunt: 0.8
  retreat: 1.2
  collect: 1.0
  roam: 1.0
