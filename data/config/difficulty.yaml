schema: lambdabots/difficulty@1

# Skill parameters at the five presets. A personality's skill (0..100) picks a point on this scale:
# noob = 0, easy = 25, normal = 50, hard = 75, expert = 100. Between two presets numbers are mixed
# linearly (skill 62 is halfway between normal and hard); switches (aim_model, tricks, dodge jumps,
# bunny hop) keep the lower preset's value. A personality can override any single parameter. A preset that
# leaves a parameter out keeps its built-in value.
#
#   recognition_delay     seconds from first sight to recognizing an enemy, drawn once per contact [min, max]
#   peripheral_gain       recognition speed at the edge of the view relative to its center
#   reacquire_delay       seconds to recognize again an enemy lost less than reacquire_grace seconds ago
#   reacquire_grace       seconds after losing sight during which an enemy is recognized again quickly
#   aim_latency           view latency of the aim, seconds
#   aim_model             newbie | spring | spring_combat
#   headshot              chance to aim at the head for a contact
#   aim_error             aim error amplitude x, y, z (units)
#   turn_speed            maximum turn rate, degrees per second
#   semi_auto_delay       extra pause between semi-automatic shots, seconds [min, max]
#   stay_mid / stay_far   chance to stand still in a fight at 768..1024 / beyond 1024 units
#   crouch_tap            chance of a crouch tap while strafing
#   dodge_hop_cooldown    seconds between dodge jumps; ~ = never
#   hearing_threshold     quietest sound gain noticed
#   sound_bearing_sigma   bearing error of a heard sound, degrees
#   track_forget          seconds a lost enemy stays in memory
#   gauss_precharge       share of gauss charge held before an expected fight
#   gauss_charge          share of gauss shots fired charged rather than with the plain primary attack
#   scope_settle          seconds from putting the crossbow's scope on to the shot [min, max]
#   throw_rate            how readily grenades, satchels and snarks are thrown, 1 = the normal preset
#   throw_series          grenades thrown one after another until none is left, at the enemy or where one is
#                         expected
#   tricks                gauss jump, satchel jump and attacking long jumps
#   longjump              how readily long jumps are taken, 0..1, times the style's liking: the share of the time
#                         a bot long jumps along its way, and the chance it takes one in a fight when one fits
#   longjump_bold         long jumps along the way round corners, down drops, over short stretches and one after
#                         another, and onto a hard landing with more than 60 health
#   longjump_dodge        long jumps aside or away in a fight (for a dodge jump, away from a blast), the view back
#                         on the enemy in the air
#   gauss_walls           charged gauss shots through thin walls at an enemy lost behind one a moment ago
#   bhop_speed            bunny hop speed limit, multiple of maxspeed; ~ = no bunny hopping

presets:
  noob:
    recognition_delay: [1.5, 2.0]
    peripheral_gain: 0.35
    reacquire_delay: 0.35
    reacquire_grace: 1.0
    aim_latency: 0.30
    aim_model: newbie
    headshot: 0.15
    aim_error: [20, 20, 40]
    turn_speed: 180
    semi_auto_delay: [0.7, 0.8]
    stay_mid: 0.60
    stay_far: 0.85
    crouch_tap: 0.0
    dodge_hop_cooldown: ~
    hearing_threshold: 0.07
    sound_bearing_sigma: 35
    track_forget: 4
    gauss_precharge: 0.0
    gauss_charge: 0.2
    scope_settle: [1.0, 1.4]
    throw_rate: 0.5
    throw_series: false
    tricks: false
    longjump: 0.15
