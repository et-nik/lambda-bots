name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Version from the tag
        run: echo "LB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Package
        run: >
          cargo xtask package --version "$LB_VERSION" --out dist
          --linux artifacts/lambdabots-linux-i386/lambdabots_mm_i386.so
          --windows artifacts/lambdabots-windows-x86/lambdabots_mm.dll
          --macos artifacts/lambdabots-macos-arm64/lambdabots_mm.dylib
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
