[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [
    { name = "serde_yaml", reason = "deprecated; use serde-saphyr behind lb_config::yaml" },
    { name = "serde_yml", reason = "RUSTSEC-2025-0068" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
